<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565C0">

  {% assign page_title = site.title | escape %}
  {% if page.title %}{% assign page_title = page.title | escape | append: " - " | append: page_title %}{% endif %}
  {% assign page_description = page.description | default: site.description | escape %}

  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/logo.png' | absolute_url }}">
  <meta property="og:locale" content="de_DE">

  <link rel="icon" type="image/png" href="assets/logo.png">

  <!--Import Google Icon Font-->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!--Bootstrap-CSS einbinden-->
  <link type="text/css" rel="stylesheet" href="css/main.css" media="screen,projection">
</head>
