- time: "2017 - Heute"
  title: "Extreme Networks Certified Engineer"
  text: >
    Aktuell bin ich an der absolvierung der Extreme Networks Certified Engineer Prüfung.
    Diese dauert aufgrund ihrer komplexität aber noch an.

- time: "2016"
  title: "Sophos UTM Architect"
  text: >
    Im Anschluss an meine Ausbildung bin ich zu
    der Firma <u><a class="text-white" href="https://www.mowasystems.de" target="_blank" rel="noopener">mowaSYSTEMS GmbH</a></u> gewechselt.
    Dort habe ich dann die 5-Tägige Schulung zum Sophos UTM Architect in Münster besucht und abgeschlossen

- time: "2016"
  title: "Ausbildung zum Fachinformatiker"
  text: >
    Nach dem Abitur habe ich meine 3-Jährige Ausbildung
    zum Fachinformatiker mit der Fachrichtung Systemintegration
    bei dem Bischöflichen Ordinariat der Diözese Rottenburg Stuttgart abgeschlossen.

- time: "2015"
  title: "Musikverein Hart"
  text: >
    In diesem Jahr habe ich die Website des
    <u><a class="text-white" href="http://www.musikverein-hart.de" target="_blank" rel="noopener">Musikverein Hart</a></u>
    komplett neu gestaltet und auf den aktuellen Stand gebracht.

- time: "2013"
  title: "Allgemeines Abitur"
  text: "Mein Abitur habe ich auf dem Gymnasium in Haigerloch absolviert"

- time: "2010"
  title: "Erste Website"
  text: >
    In der 10. Klasse am Gymnasium bin ich das erste Mal mit dem Programmieren in Kontakt gekommen.
    Damals noch mit Robot Carol, Lazarus Pascal und meinen ersten Schritten mit HTML und CSS.

- time: "2005"
  title: "Grundschulabschluss"
  text: "Ich habe meine Grundschule, wie so ziemlich jeder auch, im Alter von 10 abgeschlossen."
