# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: makeitSYSTEMS
email: info@makeitsystems.de
description: "makeitSYSTEMS – private Website von Mathias Kessler mit Lebenslauf, Impressum und mehr."
lang: de
# Wird als GitHub-Pages-Projektseite ohne eigene Domain ausgeliefert
# (siehe .github/workflows/pages.yml), daher Repo-Name als baseurl.
url: "https://drikani.github.io"
baseurl: "/makeitsystems.de"

# Kontaktdaten, damit sie an einer Stelle gepflegt und per {{ site.contact.* }}
# (z.B. auf der Impressum-Seite) eingebunden werden statt fest im HTML zu stehen.
contact:
  name: Mathias Kessler
  company: MaKeIT SYSTEMS
  street: Hardenbergstraße 11
  zip: "72768"
  city: Reutlingen
  country: Deutschland
  domain: makeitsystems.de

# Startjahr für das dynamische Copyright im Footer (siehe footer.html) –
# das aktuelle Jahr wird zur Build-Zeit automatisch ergänzt.
copyright_start_year: 2019

# Für die theme-color-Meta-Tags in head.html (färbt u.a. unter iOS/macOS
# Safari die Adresszeile ein). Muss zu $lt-color-primary/$dt-color-primary
# in _sass/_main-variables.scss passen – dort ist es die tatsächliche
# Sass-Quelle (color("blue"/"deep-orange", "darken-3")), hier nur der
# kompilierte Hex-Wert, weil Jekyll-Config und Sass sich sonst nicht
# gegenseitig referenzieren können.
theme_color:
  light: "#1565C0"
  dark: "#D84315"

# Build settings.
markdown: kramdown
exclude: ["README.md"]

# Sass settings
sass:
  sass_dir: _sass
  style: compact
  # Unterdrückt Deprecation-Warnungen aus Abhängigkeiten (Bootstrap-Gem);
  # ohne das erzeugt die schiere Menge an Warnungen einen Compile-Fehler.
  quiet_deps: true
